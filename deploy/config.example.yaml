# The installer replaces port 0 with a randomly selected unused port.
listen: 0.0.0.0:0
username: admin
# Generate the actual hash with lnmp-gopanel init (never a default password).
password_hash: REPLACE_WITH_GENERATED_BCRYPT_HASH
secure_cookie: true
tls:
  cert_file: /etc/lnmp-gopanel/tls/panel.crt
  key_file: /etc/lnmp-gopanel/tls/panel.key
# Optional fixed HTTPS origin, including the port when using a non-default port.
public_origin: ""
helper: /usr/local/libexec/lnmp-gopanel-control
# Mutable login credentials and encrypted TOTP state; back up auth-state.json and auth.key together.
auth:
  state_dir: /var/lib/lnmp-gopanel
# Custom log paths are stored as custom-logs.json; this directory is private to the panel account.
logs:
  state_dir: /var/lib/lnmp-gopanel
# Optional NAT/public IPs used as additional references for domain DNS checks.
vhosts:
  public_ips: []
# Optional Chromium executable; empty detects Chromium/Chrome on PATH.
screenshots:
  browser: ""
  state_dir: /var/lib/lnmp-gopanel
# Optional dashboard widgets; selection is stored in dashboard-widgets.json.
# Only existing local HTTP status endpoints are queried; no service config is changed.
metrics:
  state_dir: /var/lib/lnmp-gopanel
  nginx_status_url: "" # e.g. http://127.0.0.1/nginx_status
  php_fpm_status_url: "" # e.g. http://127.0.0.1/fpm-status (JSON is requested automatically)
  mysql:
    socket: "" # e.g. /tmp/mysql.sock; choose socket OR address
    address: "" # e.g. 127.0.0.1:3306
    user: "" # dedicated account able to run SHOW GLOBAL STATUS
    password: ""
