name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Check and test frontend
        working-directory: web
        run: |
          npm run format:check
          npm test
          npm run build
      - name: Check and test Go
        run: |
          test -z "$(gofmt -l cmd internal web/*.go)"
          go vet ./...
          go test -race ./...
      - name: Check installer and packaging scripts
        run: |
          bash -n install.sh scripts/package.sh
          shellcheck install.sh scripts/package.sh
          sudo python3 scripts/test-install.py
      - name: Test real Chromium screenshots
        run: |
          cd web
          npx playwright install --with-deps chromium
          screenshot_browser="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          cd ..
          # Only this isolated local-server fixture disables Chromium's sandbox
          # when root; production screenshot code always requires a normal user.
          sudo SCREENSHOT_TEST_BROWSER="$screenshot_browser" "$(command -v go)" test -race ./internal/screenshots -run TestChromiumIntegration -count=1
      - name: Build amd64 and arm64 archives
        run: |
          build_version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            build_version="$GITHUB_REF_NAME"
          fi
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            bash scripts/package.sh "$arch" "$build_version"
          done
          cp install.sh dist/install.sh
          cd dist
          sha256sum lnmp-gopanel_linux_*.tar.gz > SHA256SUMS
      - name: Upload installation packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lnmp-gopanel-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lnmp-gopanel-linux
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
